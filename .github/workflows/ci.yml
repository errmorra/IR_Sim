name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Validate — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system packages (tkinter + virtual display)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb fonts-dejavu-core

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install pyflakes

      - name: Compile
        run: python -m py_compile app.py scoring.py validate_scenarios.py

      - name: Lint (pyflakes)
        run: python -m pyflakes app.py scoring.py validate_scenarios.py tests

      - name: Validate scenarios.json (schema + scoring + shuffle stability)
        run: python validate_scenarios.py --quiet

      - name: Unit tests (scoring, session, report)
        run: python -m unittest tests.test_scoring tests.test_session_report -v

      - name: GUI smoke test (headless Xvfb)
        run: xvfb-run -a -s "-screen 0 1400x900x24" python -m unittest tests.test_gui_smoke -v
